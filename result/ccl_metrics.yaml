openapi: 3.0.3
info:
  title: CCL metrics models
  version: ^0.0.0
components:
  schemas:
    Ccl.Metrics.Request:
      description: >-
        Request to retrieve CCL (Collective Communication) metrics.
      type: object
      properties:
        communicator_names:
          description: >-
            Filter results by communicator name. An empty list returns results
            for all communicators.
          type: array
          items:
            type: string
          x-field-uid: 1
        stage_index:
          description: >-
            Filter results by stage index. -1 returns all stages (default).
            Only meaningful when stage_mode = multiple or llm.
          type: integer
          default: -1
          x-field-uid: 2
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            An empty list returns all columns.
          type: array
          items:
            type: string
            x-enum:
              jct:
                x-field-uid: 1
              calibrated_jct:
                x-field-uid: 2
              ideal_jct:
                x-field-uid: 3
              jct_percent:
                x-field-uid: 4
              alg_bw:
                x-field-uid: 5
              bus_bw:
                x-field-uid: 6
              avg_jct:
                x-field-uid: 7
              max_jct:
                x-field-uid: 8
              min_jct:
                x-field-uid: 9
              max_tail_latency_us:
                x-field-uid: 10
              iteration_count:
                x-field-uid: 11
              drop_count:
                x-field-uid: 12
              reorder_count:
                x-field-uid: 13
          x-field-uid: 3
        include_tail_latency_cdf:
          description: >-
            When true, include tail latency CDF distribution buckets in
            each CclMetric response.
          type: boolean
          default: false
          x-field-uid: 4
        include_abnormal_iterations:
          description: >-
            When true, include the list of abnormal iteration records in
            each CclMetric response.
          type: boolean
          default: false
          x-field-uid: 5

    Ccl.Metric:
      description: >-
        CCL metrics for one communicator (and one stage, for multi-stage configs).
        Includes JCT measurements, bandwidth, and optional CDF/abnormal data.
      type: object
      properties:
        communicator_name:
          description: Name of the communicator this metric row belongs to.
          type: string
          x-field-uid: 1
        stage_index:
          description: Stage index this metric row belongs to. -1 for single-stage.
          type: integer
          x-field-uid: 2
        stage_name:
          description: Stage name (empty string for single-stage).
          type: string
          x-field-uid: 3
        jct:
          description: Measured Job Completion Time in seconds.
          type: number
          format: double
          x-field-uid: 4
        calibrated_jct:
          description: Calibrated JCT after subtracting measurement overhead (seconds).
          type: number
          format: double
          x-field-uid: 5
        ideal_jct:
          description: Theoretical optimal JCT based on data_size and link rate (seconds).
          type: number
          format: double
          x-field-uid: 6
        jct_percent:
          description: calibrated_jct / ideal_jct * 100. Values near 100 indicate ideal performance.
          type: number
          format: double
          x-field-uid: 7
        alg_bw:
          description: Algorithm bandwidth = data_size / jct (Gbps).
          type: number
          format: double
          x-field-uid: 8
        bus_bw:
          description: >-
            Bus bandwidth = alg_bw * algorithm_coefficient (Gbps).
            Coefficients follow nccl-tests convention:
            AllReduce 2(N-1)/N, AllToAll (N-1)/N, PointToPoint 1.
          type: number
          format: double
          x-field-uid: 9
        avg_jct:
          description: Average JCT across all completed iterations (seconds).
          type: number
          format: double
          x-field-uid: 10
        max_jct:
          description: Maximum JCT across all iterations (seconds). Indicates worst-case latency.
          type: number
          format: double
          x-field-uid: 11
        min_jct:
          description: Minimum JCT across all iterations (seconds).
          type: number
          format: double
          x-field-uid: 12
        max_tail_latency_us:
          description: Maximum tail latency across all ranks in microseconds.
          type: integer
          x-field-uid: 13
        iteration_count:
          description: Number of completed iterations.
          type: integer
          x-field-uid: 14
        drop_count:
          description: Total dropped packets. Acceptance criterion for lossless = 0.
          type: integer
          x-field-uid: 15
        reorder_count:
          description: Total reordered packets.
          type: integer
          x-field-uid: 16
        tail_latency_cdf:
          description: >-
            Tail latency CDF distribution. Populated when
            Ccl.Metrics.Request.include_tail_latency_cdf = true.
          type: array
          items:
            $ref: '#/components/schemas/Ccl.TailLatencyCDFBucket'
          x-field-uid: 17
        abnormal_iterations:
          description: >-
            List of abnormal iteration records. Populated when
            Ccl.Metrics.Request.include_abnormal_iterations = true.
          type: array
          items:
            $ref: '#/components/schemas/Ccl.AbnormalIterationMetric'
          x-field-uid: 18

    Ccl.TailLatencyCDFBucket:
      description: One bucket in the tail latency CDF distribution.
      type: object
      properties:
        percent:
          description: Cumulative percentage at this bucket boundary (e.g. 99.9).
          type: number
          format: double
          x-field-uid: 1
        transmission_time_us:
          description: Transmission time at this cumulative percentile (microseconds).
          type: number
          format: double
          x-field-uid: 2
        count:
          description: Number of streams falling in this bucket.
          type: integer
          x-field-uid: 3

    Ccl.AbnormalIterationMetric:
      description: >-
        Record for one abnormal iteration that exceeded the configured thresholds
        in Ccl.AbnormalThreshold.
      type: object
      properties:
        iteration:
          description: 1-based iteration index that was flagged as abnormal.
          type: integer
          x-field-uid: 1
        stage_index:
          description: Stage index this abnormal iteration belongs to (-1 for single-stage).
          type: integer
          x-field-uid: 2
        is_complete:
          description: Whether the iteration completed (false = timed out or aborted).
          type: boolean
          x-field-uid: 3
        failure_reason:
          description: Human-readable description of why this iteration was flagged.
          type: string
          x-field-uid: 4
        jct_percent:
          description: calibrated_jct / ideal_jct * 100 for this iteration.
          type: number
          format: double
          x-field-uid: 5
        drop_count:
          description: Packet drops in this iteration.
          type: integer
          x-field-uid: 6
        reorder_count:
          description: Packet reorders in this iteration.
          type: integer
          x-field-uid: 7
        rx_cnp_count:
          description: CNP (Congestion Notification Packet) frames received in this iteration.
          type: integer
          x-field-uid: 8
        rx_ecn_count:
          description: ECN-marked frames received in this iteration.
          type: integer
          x-field-uid: 9
        rx_pfc_count:
          description: PFC pause frames received in this iteration.
          type: integer
          x-field-uid: 10
