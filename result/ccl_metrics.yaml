openapi: 3.0.3
info:
  title: CCL metrics models
  version: ^0.0.0
components:
  schemas:
    Ccl.Metrics.Request:
      description: >-
        Request to retrieve CCL (Collective Communication) metrics.
      type: object
      properties:
        communicator_names:
          description: >-
            Filter results by communicator name. An empty list returns results
            for all communicators.
          type: array
          items:
            type: string
          x-field-uid: 1
        stage_index:
          description: >-
            Filter results by stage index. -1 returns all stages (default).
            Only meaningful when stage_mode = multiple or llm.
          type: integer
          default: -1
          x-field-uid: 2
        column_names:
          description: >-
            The list of column names that the returned result set will contain.
            An empty list returns all columns.
          type: array
          items:
            type: string
            x-enum:
              jct:
                x-field-uid: 1
              calibrated_jct:
                x-field-uid: 2
              ideal_jct:
                x-field-uid: 3
              jct_percent:
                x-field-uid: 4
              alg_bw:
                x-field-uid: 5
              bus_bw:
                x-field-uid: 6
              avg_jct:
                x-field-uid: 7
              max_jct:
                x-field-uid: 8
              min_jct:
                x-field-uid: 9
              max_tail_latency_us:
                x-field-uid: 10
              iteration_count:
                x-field-uid: 11
              drop_count:
                x-field-uid: 12
              reorder_count:
                x-field-uid: 13
              l1_alg_bw:
                x-field-uid: 14
              l1_bus_bw:
                x-field-uid: 15
              reduce_time:
                x-field-uid: 16
              training_time:
                x-field-uid: 17
              trans_time:
                x-field-uid: 18
          x-field-uid: 3
        include_tail_latency_cdf:
          description: >-
            When true, include tail latency CDF distribution buckets in
            each CclMetric response.
          type: boolean
          default: false
          x-field-uid: 4
        include_loop_metrics:
          description: >-
            When true, include per-stage-loop JCT metrics in each CclMetric
            response. Only meaningful when stage_loop_count > 1.
            Maps to CclJctLoopResult in STC.
          type: boolean
          default: false
          x-field-uid: 5
          x-status:
            status: under-review
            information: Depends on stage_loop_count which is not yet implemented.

    Ccl.Metric:
      description: >-
        CCL metrics for one communicator (and one stage, for multi-stage configs).
        Includes JCT measurements, bandwidth, time breakdown, and optional CDF/stream data.
      type: object
      properties:
        communicator_name:
          description: Name of the communicator this metric row belongs to.
          type: string
          x-field-uid: 1
        stage_index:
          description: Stage index this metric row belongs to. -1 for single-stage.
          type: integer
          x-field-uid: 2
        stage_name:
          description: Stage name (empty string for single-stage).
          type: string
          x-field-uid: 3
        jct:
          description: Measured Job Completion Time in seconds.
          type: number
          format: double
          x-field-uid: 4
        calibrated_jct:
          description: Calibrated JCT after subtracting measurement overhead (seconds).
          type: number
          format: double
          x-field-uid: 5
        ideal_jct:
          description: Theoretical optimal JCT based on data_size and link rate (seconds).
          type: number
          format: double
          x-field-uid: 6
        jct_percent:
          description: calibrated_jct / ideal_jct * 100. Values near 100 indicate ideal performance.
          type: number
          format: double
          x-field-uid: 7
        alg_bw:
          description: Algorithm bandwidth = data_size / calibrated_jct (Gbps).
          type: number
          format: double
          x-field-uid: 8
        bus_bw:
          description: >-
            Bus bandwidth = alg_bw * algorithm_coefficient (Gbps).
            Coefficients follow nccl-tests convention:
            AllReduce 2(N-1)/N, AllToAll (N-1)/N, PointToPoint 1.
          type: number
          format: double
          x-field-uid: 9
        avg_jct:
          description: Average JCT across all completed iterations (seconds).
          type: number
          format: double
          x-field-uid: 10
        max_jct:
          description: Maximum JCT across all iterations (seconds). Indicates worst-case latency.
          type: number
          format: double
          x-field-uid: 11
        min_jct:
          description: Minimum JCT across all iterations (seconds).
          type: number
          format: double
          x-field-uid: 12
        max_tail_latency_us:
          description: Maximum tail latency across all ranks in microseconds.
          type: integer
          x-field-uid: 13
        iteration_count:
          description: Number of completed iterations.
          type: integer
          x-field-uid: 14
        drop_count:
          description: >-
            Total dropped packets across all streams for this communicator.
            Aggregated from CclStreamResult.DropCount. Acceptance criterion
            for lossless fabric = 0.
          type: integer
          x-field-uid: 15
        reorder_count:
          description: >-
            Total reordered packets across all streams for this communicator.
            Aggregated from CclStreamResult.ReorderCount.
          type: integer
          x-field-uid: 16
        tail_latency_cdf:
          description: >-
            Tail latency CDF distribution. Populated when
            Ccl.Metrics.Request.include_tail_latency_cdf = true.
          type: array
          items:
            $ref: '#/components/schemas/Ccl.TailLatencyCDFBucket'
          x-field-uid: 17
        l1_alg_bw:
          description: >-
            Layer-1 algorithm bandwidth (Gbps), calculated using the JCT basis.
            Includes Ethernet/IP/UDP/RoCEv2 frame overhead, matching the
            physical link utilization measured by line-rate counters.
            Use this to compare against port line rate; use alg_bw to compare
            against nccl-tests / GPU benchmarks (which report payload BW).
            Maps to CclJctResult.L1AlgBwJCT.
          type: number
          format: double
          x-field-uid: 19
        l1_bus_bw:
          description: >-
            Layer-1 bus bandwidth (Gbps), calculated using the JCT basis.
            L1 equivalent of bus_bw; includes frame overhead.
            Maps to CclJctResult.L1BusBwJCT.
          type: number
          format: double
          x-field-uid: 20
        reduce_time:
          description: >-
            Total GPU compute (reduce) time accumulated across all iterations
            (seconds). Represents time ranks spent on local computation between
            communication phases. Maps to CclJctResult.ReduceTime.
          type: number
          format: double
          x-field-uid: 21
        training_time:
          description: >-
            Total training time = communication time + reduce time (seconds).
            Represents one full training step including both compute and
            collective communication. Maps to CclJctResult.TrainingTime.
          type: number
          format: double
          x-field-uid: 22
        trans_time:
          description: >-
            Total pure transmission time (seconds), excluding compute gaps.
            Maps to CclJctResult.TransTime.
          type: number
          format: double
          x-field-uid: 23
        loop_metrics:
          description: >-
            Per-stage-loop JCT breakdown. Populated when
            Ccl.Metrics.Request.include_loop_metrics = true and
            stage_loop_count > 1. Each entry is one complete pass through
            all stages. Maps to CclJctLoopResult in STC.
          type: array
          items:
            $ref: '#/components/schemas/Ccl.LoopMetric'
          x-field-uid: 24
          x-status:
            status: under-review
            information: Depends on stage_loop_count which is not yet implemented.

    Ccl.LoopMetric:
      description: >-
        JCT and bandwidth metrics for one stage-loop iteration.
        One entry per completed pass through the full stage sequence.
        Only populated when stage_loop_count > 1 and
        include_loop_metrics = true in the metrics request.
        Maps to CclJctLoopResult in STC.
      type: object
      properties:
        stage_loop:
          description: 1-based stage loop index.
          type: integer
          x-field-uid: 1
        jct:
          description: Measured JCT for this loop (seconds).
          type: number
          format: double
          x-field-uid: 2
        calibrated_jct:
          description: Calibrated JCT for this loop (seconds).
          type: number
          format: double
          x-field-uid: 3
        ideal_jct:
          description: Ideal JCT for this loop (seconds).
          type: number
          format: double
          x-field-uid: 4
        jct_percent:
          description: calibrated_jct / ideal_jct * 100 for this loop.
          type: number
          format: double
          x-field-uid: 5
        alg_bw:
          description: Algorithm bandwidth for this loop (Gbps).
          type: number
          format: double
          x-field-uid: 6
        bus_bw:
          description: Bus bandwidth for this loop (Gbps).
          type: number
          format: double
          x-field-uid: 7
        l1_alg_bw:
          description: Layer-1 algorithm bandwidth for this loop (Gbps).
          type: number
          format: double
          x-field-uid: 8
        l1_bus_bw:
          description: Layer-1 bus bandwidth for this loop (Gbps).
          type: number
          format: double
          x-field-uid: 9
        avg_jct:
          description: Average JCT across iterations in this loop (seconds).
          type: number
          format: double
          x-field-uid: 10
        max_jct:
          description: Maximum JCT across iterations in this loop (seconds).
          type: number
          format: double
          x-field-uid: 11
        min_jct:
          description: Minimum JCT across iterations in this loop (seconds).
          type: number
          format: double
          x-field-uid: 12
        max_tail_latency_us:
          description: Maximum tail latency across all ranks in this loop (µs).
          type: integer
          x-field-uid: 13
        iteration_count:
          description: Number of completed iterations in this loop.
          type: integer
          x-field-uid: 14

    Ccl.TailLatencyCDFBucket:
      description: One bucket in the tail latency CDF distribution.
      type: object
      properties:
        percent:
          description: Cumulative percentage at this bucket boundary (e.g. 99.9).
          type: number
          format: double
          x-field-uid: 1
        transmission_time_percent:
          description: >-
            Transmission time at this cumulative percentile expressed as a
            percentage of the ideal transmission time based on line rate.
            Maps to CclTailLatencyCDFResult.TransmissionTimePercent in STC.
            Values above 100% indicate congestion or retransmission overhead.
          type: number
          format: double
          x-field-uid: 2


