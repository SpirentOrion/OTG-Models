components:
  schemas:
    Rocev2.Flows:
      description: |-
        RoCEv2 traffic flow configuration.
      type: object
      properties:
        tx_ports:
          description: |-
            Specifies the list of transmit (TX) ports used for sending RoCEv2 traffic.
          type: array
          items:
            $ref: '#/components/schemas/Rocev2.TxPorts'
          x-field-uid: 1
    Rocev2.TxPorts:
      description: |-
        Defines the transmit (TX) port settings for RoCEv2 traffic, including the port name and transmission type configuration.
      type: object
      properties:
        port_name:
          description: >-
            The name of port for which this settings will be applied to.
          type: string
          x-constraint:
          - '/components/schemas/Port/properties/name'
          x-field-uid: 1
        transmit_type:
          $ref: '#/components/schemas/Rocev2.TransmitType'
          x-field-uid: 2   
    Rocev2.TransmitType:
      description: |-
        RoCEv2 flows can be configured to run in continuous mode or fixed iteration.
      type: object
      properties:
        choice:
          type: string
          default: target_line_rate
          x-enum:
            target_line_rate:
              x-field-uid: 1
          x-field-uid: 1
        target_line_rate:
          $ref: '#/components/schemas/Rocev2.TargetLineRate'
          x-field-uid: 2
    Rocev2.TargetLineRate:
      description: |- 
        Configure target line rate of traffic rate on this port as percentage of link speed.
      type: object
      properties:
        value:
          description: |-
            Target Line Rate as percentage of max line rate.
          type: integer
          format: uint64
          minimum: 0
          maximum: 100
          default: 98
          x-field-uid: 1
        flows:
          type: array
          items:
            $ref: '#/components/schemas/Rocev2.Flow'
          x-field-uid: 2
    Rocev2.Flow:
      description: |-
        Configure properties for a specific RoCE flow on the Tx port.
      type: object
      required: [tx_endpoint, name]
      properties:
        tx_endpoint:          
          description: |-
              The unique name of an emulated device that will be transmitting the flows.
          type: string
          x-constraint:
          - '/components/schemas/Rocev2.QPs/properties/qp_name'
          x-field-uid: 1
        rx_endpoint:
          description: |-
              The unique name of remote QP or port which be receiving the packets for the flow.
          type: string
          x-constraint:
          - '/components/schemas/Port/properties/name'
          - '/components/schemas/Rocev2.QPs/properties/qp_name'
          x-field-uid: 2
        name:
          x-include: ../../common/common.yaml#/components/schemas/Named.Object/properties/name
          x-field-uid: 3
        rocev2_verb:
          $ref: '#/components/schemas/Rocev2.Verb'
          x-field-uid: 4
        message_size:
          description: >-
            Length of Message that needs to be transmitted to the remote end-point.
          type: integer
          format: uint32
          default: 1
          minimum: 0
          maximum: 65535
          x-field-uid: 5
        message_size_unit:
          description: >-
            Unit of the transfer message size. Available options are Bytes, KiloBtyes (KB), NegaBytes (MB) and GigaBytes (GB).
          type: string
          default: mb
          x-enum:
            bytes:
              x-field-uid: 1
            kb:
              x-field-uid: 2
            mb:
              x-field-uid: 3
            gb:
              x-field-uid: 4
          x-field-uid: 6
        duration:
          $ref: '#/components/schemas/Rocev2.FlowDuration'
          x-field-uid: 7
    Rocev2.FlowDuration:
      description: >-
        Determines when this flow automatically stops sending message_size
        RDMA operations. continuous (default) is today's behavior: the flow
        keeps running per Rocev2.TransmitType.choice until externally
        stopped. fixed_message_count and fixed_data_size are two equivalent
        ways to express the same stopping condition -- pick whichever unit
        is natural for the test: an exact operation count, or an
        approximate total data volume.
      type: object
      properties:
        choice:
          type: string
          default: continuous
          x-enum:
            continuous:
              x-field-uid: 1
            fixed_message_count:
              x-field-uid: 2
            fixed_data_size:
              x-field-uid: 3
          x-field-uid: 1
        fixed_message_count:
          $ref: '#/components/schemas/Rocev2.FixedMessageCount'
          x-field-uid: 2
        fixed_data_size:
          $ref: '#/components/schemas/Rocev2.FixedDataSize'
          x-field-uid: 3
    Rocev2.FixedMessageCount:
      description: >-
        Transmit a fixed number of message_size-sized RDMA operations, then
        stop. Total data transferred is exactly count * message_size -- no
        rounding or truncation, since count is what actually gets posted.
      type: object
      properties:
        count:
          description: >-
            Number of message_size-sized RDMA operations to send before
            this flow stops.
          type: integer
          format: uint64
          default: 1
          minimum: 1
          x-field-uid: 1
    Rocev2.FixedDataSize:
      description: >-
        Transmit until approximately this much total data has been sent,
        then stop. Total data is chunked into repeated message_size
        operations; when size is not an exact multiple of message_size,
        the final operation is truncated to the remaining byte count
        (implementation-defined rounding otherwise). Prefer
        fixed_message_count when an exact, unambiguous stop point matters.
      type: object
      properties:
        size:
          description: >-
            Total amount of data to transfer for this flow.
          type: integer
          format: uint64
          default: 1
          minimum: 0
          x-field-uid: 1
        unit:
          description: >-
            Unit of size. Available options are Bytes, KiloBytes (KB),
            MegaBytes (MB) and GigaBytes (GB).
          type: string
          default: gb
          x-enum:
            bytes:
              x-field-uid: 1
            kb:
              x-field-uid: 2
            mb:
              x-field-uid: 3
            gb:
              x-field-uid: 4
          x-field-uid: 2
    Rocev2.Verb:
      description: >-
          RoCEv2 Verb. Available options are: WRITE, WRITE_With_Immediate, SEND, SEND_With_Immediate and READ.
      type: object
      properties:
        choice:
          type: string
          default: write
          x-enum:
            write:
              x-field-uid: 1
            write_with_immediate:
              x-field-uid: 2
            send:
              x-field-uid: 3
            send_with_immediate:
              x-field-uid: 4
            read:
              x-field-uid: 5
          x-field-uid: 1
        write_with_immediate:
          $ref: '#/components/schemas/Rocev2.ImmediateData'
          x-field-uid: 2
        send_with_immediate:
          $ref: '#/components/schemas/Rocev2.ImmediateData'
          x-field-uid: 3
    Rocev2.ImmediateData:
      description: >-
            Four bytes of immediate Data for SEND/WRITE with immediate.
      type: object
      properties:
        immediate_data:
          description: >-
            Four bytes of immediate Data for SEND/WRITE with immediate.
          type: string
          format: hex
          default: "00000000"
          minimum: 1
          maximum: 8
          x-field-uid: 1