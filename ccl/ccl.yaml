openapi: 3.0.3
info:
  title: CCL config models
  description: >-
    Collective Communication Library configuration schemas.
  version: ^0.0.0
components:
  schemas:
    Ccl.Config:
      description: >-
        Collective communication configuration. Simulates NCCL-style
        AllReduce / AllToAll operations and measures Job Completion Time (JCT).
        Algorithm, communicators, and traffic parameters are configured per
        stage via stages[]. For a simple single-algorithm test, define one stage.
      type: object
      required:
        - name
      properties:
        name:
          description: >-
            Unique name for this CCL configuration. Used as a reference
            in metrics requests.
          type: string
          x-field-uid: 1
        transport:
          description: >-
            Underlying transport type for CCL traffic.
            rocev2: RoCEv2 QP-based transport (production AI Fabric).
            uet: Ultra Ethernet Transport (UEC v1.0, 2024+).
          type: string
          x-field-uid: 2
          x-enum:
            rocev2:
              x-field-uid: 1
            uet:
              x-field-uid: 2
        send_mode:
          description: >-
            async: next iteration starts without waiting for all ranks to complete
            (pipelined).
            sync: each iteration waits for all ranks to complete before proceeding.
          type: string
          x-field-uid: 4
          x-enum:
            async:
              x-field-uid: 1
            sync:
              x-field-uid: 2
        sync_send_interval:
          description: >-
            Interval between ports in sync send mode (ms). Only effective
            when send_mode = sync.
          type: integer
          default: 0
          minimum: 0
          x-field-uid: 5
        stage_mode:
          description: >-
            default: standard sequential stage execution.
            llm: LLM-specific multi-phase mode (Prefill/Decode etc.); enables
            LLM-aware Sequencer behavior in the backend.
          type: string
          x-field-uid: 6
          x-enum:
            default:
              x-field-uid: 1
            llm:
              x-field-uid: 3
        stage_loop_count:
          description: >-
            Number of times to repeat the full stage sequence (all stages = one
            loop). Ignored when stages contains only one entry.
          type: integer
          default: 1
          minimum: 1
          x-field-uid: 7
        stages:
          description: >-
            Ordered list of stages. Each stage defines its own algorithm,
            communicators, and traffic parameters. For a single-algorithm test,
            provide exactly one stage.
          type: array
          items:
            $ref: './stage.yaml#/components/schemas/Ccl.Stage'
          x-field-uid: 14
