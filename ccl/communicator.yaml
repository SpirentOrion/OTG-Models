openapi: 3.0.3
info:
  title: CCL communicator models
  version: ^0.0.0
components:
  schemas:
    Ccl.Communicator:
      description: >-
        A communicator defines the set of devices (ranks) participating in one
        collective operation. Corresponds to MPI_Comm / NCCL communicator.
        Use device_names (IP/MAC taken from devices[]).
        List order determines rank assignment: index 0 = rank 0.
        Multiple communicators model parallel training jobs sharing the same fabric.
      type: object
      required:
        - name
      properties:
        name:
          description: Unique name for this communicator. Used as key in metrics results.
          type: string
          x-field-uid: 1
        device_names:
          description: >-
            Ordered list of device names (from Config.devices) forming this
            communicator. Each device must have ethernet + ipv4/ipv6 configured.
            CCL reads IP/MAC from these devices and generates QP configuration
            automatically. Do NOT configure device.rocev2 on these devices.
            List order determines rank assignment: index 0 = rank 0.
          type: array
          items:
            type: string
          x-constraint:
            - '/components/schemas/Device/properties/name'
          x-field-uid: 2
        algorithm:
          description: >-
            Per-communicator algorithm override. When set, this communicator uses
            the specified algorithm and phase instead of the stage-level default.
            Use this when different communicators in the same stage run different
            collective operations simultaneously (e.g., TP group uses ring_allreduce
            while EP group uses all_to_all_direct).
            When not set, the communicator inherits stage.algorithm.
          $ref: './algorithm.yaml#/components/schemas/Ccl.Algorithm'
          x-field-uid: 3
          x-status:
            status: under-review
            information: Per-communicator algorithm override is not yet implemented in the backend.
        traffic_params:
          description: >-
            Traffic generation parameters for this communicator.
            Different communicators in the same stage may carry different data
            volumes and QP counts (e.g., TP group vs EP group), so traffic
            parameters are configured per communicator.
          $ref: './traffic_params.yaml#/components/schemas/Ccl.TrafficParams'
          x-field-uid: 4
        rocev2:
          description: >-
            RoCEv2 port-level parameters applied to all ports listed in device_names.
            Only applicable when transport = rocev2.
            These settings (DSCP, PFC, ECN, connection pacing) are port-scope
            and shared across all QPs auto-generated for this communicator.
          $ref: './rocev2_params.yaml#/components/schemas/Ccl.Rocev2Params'
          x-field-uid: 5
