openapi: 3.0.3
info:
  title: CCL RoCEv2 parameters models
  version: ^0.0.0
components:
  schemas:
    Ccl.Rocev2Params:
      description: >-
        RoCEv2 transport parameters used as a global template for all QPs
        auto-generated by the CCL engine. Only applicable when
        Ccl.Config.transport = rocev2; ignored for transport = uet or none.

        CCL auto-generates O(rankCount x qps_per_rank x algorithm_steps) QPs
        per communicator. Unlike Device.Rocev2Peer where each QP is individually
        configured by the user, Ccl.Rocev2Params defines shared defaults applied
        uniformly across all generated QPs.

        dscp, ecn, pfc_priority, start_qp_number, start_udp_src_port, and
        transport_service_type correspond conceptually to fields in
        Device.Rocev2Peer.Rocev2.QPParameters, but apply as global defaults
        rather than per-QP settings. start_qp_number and start_udp_src_port
        are base values from which the CCL engine increments sequentially across
        generated QPs (e.g. start_qp_number=100 yields QP0=100, QP1=101, ...).

        enable_ecn_cnp and enable_pfc are CCL-level on/off switches for DCQCN
        and PFC. Fine-grained DCQCN algorithm tuning (alpha, rate timers) is
        out of CCL scope and belongs in Rocev2.PerPortSettings.dcqcn_settings.
        enable_retransmit is a simplified on/off for all CCL QPs; the per-QP
        equivalent (Rocev2.AckAndNak.enable_retransmission_timeout) also
        exposes timeout_value and retry_count knobs not needed at CCL level.

        burst_per_ack, max_connections, and connection_reqs_per_sec have no
        equivalent in Device.Rocev2Peer or Rocev2.PerPortSettings. They are
        CCL-specific test orchestration parameters: burst_per_ack paces the
        RC in-flight window; max_connections and connection_reqs_per_sec
        control concurrency and rate of dynamic QP connection setup, which
        does not exist in the static per-QP Device.Rocev2Peer model.

        Do not configure Device.Rocev2Peer on devices referenced by
        Ccl.Communicator.device_names; CCL manages QP lifecycle internally.
      type: object
      properties:
        dscp:
          description: >-
            IP DSCP value applied to all auto-generated QP data packets.
            All ranks in the communicator use the same DSCP value to map
            traffic to the DUT lossless queue (typically 24 for RoCEv2).
            Corresponds to Device.Rocev2Peer.Rocev2.QPParameters.dscp, which
            sets DSCP for one individually-configured QP. Here it is a shared
            template applied to all CCL-generated QPs.
          type: integer
          default: 24
          minimum: 0
          maximum: 63
          x-field-uid: 1
        ecn:
          description: >-
            ECN codepoint in the IP header for all auto-generated QP data
            packets. ect_1 (01) marks packets as ECN-capable, enabling DCQCN
            congestion signals from the DUT when buffers fill.
            Corresponds to Device.Rocev2Peer.Rocev2.QPParameters.ecn, which
            sets ECN for one individually-configured QP. Here it is a shared
            template applied to all CCL-generated QPs.
          type: string
          x-field-uid: 2
          x-enum:
            non_ect:
              x-field-uid: 1
            ect_1:
              x-field-uid: 2
            ect_0:
              x-field-uid: 3
            ce:
              x-field-uid: 4
        pfc_priority:
          description: >-
            PFC priority class (0-7) used for all CCL-generated QP traffic.
            Must match the DSCP-to-priority mapping on the DUT lossless queue.
            Layer1.pfc_class_N configures pause quanta per class at link level;
            this field identifies which class number the CCL traffic belongs to,
            so the tester can respond correctly to incoming PFC pause frames.
          type: integer
          default: 3
          minimum: 0
          maximum: 7
          x-field-uid: 3
        start_qp_number:
          description: >-
            Base QP number for rank 0, QP 0. The CCL engine allocates subsequent
            QPs sequentially: rank0_qp0 = start_qp_number,
            rank0_qp1 = start_qp_number + 1, and so on across all ranks.
            QP numbers 0 and 1 are reserved (IBTA IB Spec); minimum value is 2.
            Corresponds to Device.Rocev2Peer.Rocev2.QPParameters.source_qp_number,
            which sets the number for one specific user-defined QP. Here it is
            the starting offset for the CCL engine's sequential QP allocation.
          type: integer
          default: 100
          minimum: 2
          maximum: 33554431
          x-field-uid: 4
        start_udp_src_port:
          description: >-
            Base UDP source port for rank 0, QP 0. The CCL engine increments
            this value for each additional QP to produce distinct 5-tuples,
            enabling ECMP load balancing across fabric paths.
            Corresponds to Device.Rocev2Peer.Rocev2.QPParameters.udp_source_port,
            which sets the UDP source port for one specific user-defined QP.
            Here it is the starting offset for sequential port assignment.
          type: integer
          default: 49152
          minimum: 0
          maximum: 65535
          x-field-uid: 5
        transport_service_type:
          description: >-
            QP service type for all auto-generated QPs.
            ud (Unreliable Datagram): connectionless; one QP can address multiple
            peers without Connection Manager setup. Lower overhead; used for
            AllToAll without PXN.
            rc (Reliable Connection): ACK-based in-order delivery; requires
            Connection Manager handshake per QP pair. CCL implementations
            manage the QP lifecycle internally rather than through the standard
            CM flow. Used for Ring AllReduce and AllToAll with PXN.
            Corresponds to Device.Rocev2Peer.Rocev2.ConnectionType.choice (RC/UD)
            at the individual QP level. Here it is a global setting for all
            CCL-generated QPs in this communicator.
          type: string
          default: rc
          x-field-uid: 6
          x-enum:
            ud:
              x-field-uid: 1
            rc:
              x-field-uid: 2
        burst_per_ack:
          description: >-
            Number of data frames the sender transmits before waiting for an ACK
            from the receiver (RC mode only; ignored for UD).
            Controls the in-flight window size during a CCL step: lower values
            reduce reorder risk under congestion; higher values maximize
            throughput on clean paths.
            No equivalent exists in Device.Rocev2Peer or Rocev2.PerPortSettings;
            this is a CCL traffic generation parameter specific to how the tester
            paces RC acknowledgements.
          type: integer
          default: 64
          minimum: 1
          maximum: 65535
          x-field-uid: 7
        max_connections:
          description: >-
            Maximum number of simultaneously outstanding RC connection setups
            per port across all communicators. Bounds the connection
            establishment concurrency during the CM handshake phase.
            No equivalent exists in Device.Rocev2Peer; that model has the user
            define each QP statically. In CCL, connections are established
            dynamically at runtime and this parameter caps the burst.
          type: integer
          default: 300
          minimum: 1
          maximum: 16777215
          x-field-uid: 8
        connection_reqs_per_sec:
          description: >-
            Rate at which the tester issues QP connection setup requests per
            second during the CM handshake phase (RC mode only).
            Spreading connection requests over time avoids overwhelming the DUT
            CM responder in large-scale tests (many ranks, many QPs per rank).
            No equivalent exists in Device.Rocev2Peer or Rocev2.PerPortSettings;
            this is a CCL test pacing parameter with no protocol standard mapping.
          type: integer
          default: 300
          minimum: 1
          maximum: 1000
          x-field-uid: 9
        enable_retransmit:
          description: >-
            Enable RDMA message retransmission on loss (RC mode only).
            When true, the tester retransmits unacknowledged frames after a
            timeout, emulating a reliable sender. When false, lost frames are
            counted but not retransmitted, exposing raw drop behavior.
            Corresponds to Device.Rocev2Peer.Rocev2.AckAndNak.enable_retransmission_timeout,
            which also controls retransmission for individually-configured QPs
            but exposes additional timeout and retry-count knobs. Here it is a
            simple on/off applied globally to all CCL-generated QPs.
          type: boolean
          default: false
          x-field-uid: 10
        enable_ecn_cnp:
          description: >-
            Enable ECN/CNP (Congestion Notification Packet) processing.
            When true, the tester generates CNP frames in response to
            ECN-marked packets received from the DUT, activating the DCQCN
            rate-reduction loop on the sender side. Set false to measure
            baseline throughput without congestion control.
            Rocev2.PerPortSettings.dcqcn_settings exposes the full DCQCN
            algorithm (alpha, rate timers, increment thresholds). This field
            is a simpler on/off that covers the common test need of toggling
            DCQCN on or off without tuning the algorithm parameters.
          type: boolean
          default: true
          x-field-uid: 11
        enable_pfc:
          description: >-
            Enable PFC (Priority Flow Control) pause frame generation and
            processing on the pfc_priority queue.
            When true, the tester sends PFC PAUSE frames when its receive
            buffer fills and honors incoming PFC PAUSE from the DUT, achieving
            lossless Ethernet behavior for the CCL traffic class.
            Set false to test lossy behavior or measure the impact of disabling
            flow control.
            Layer1.pfc_class_N configures PFC pause quanta at link level and
            does not provide a per-traffic-class on/off switch. This field
            fills that gap for the CCL test scenario by explicitly enabling or
            disabling PFC for the class identified by pfc_priority.
          type: boolean
          default: true
          x-field-uid: 12
