openapi: 3.0.3
info:
  title: CCL RoCEv2 parameters models
  version: ^0.0.0
components:
  schemas:
    Ccl.Rocev2Template:
      description: >-
        RoCEv2 transport parameters applied as a shared template to all QPs
        auto-generated by the CCL engine. Only applicable when
        Ccl.Config.transport = rocev2; ignored for transport = uet.

        Follows the same discriminated-union pattern as
        Device.Rocev2.ConnectionType: connection-type-specific fields
        (dscp, ecn, enable_ecn_cnp) are nested under the reliable_connection
        or unreliable_datagram sub-object, while encapsulation applies to both
        and sits at the top level.

        Why not reuse Device.Rocev2Peer? Three reasons.
        First, scale: CCL generates O(N x qps_per_rank) QPs for Ring algorithms
        and O(N^2 x qps_per_rank) for AllToAll, where N is the rank count.
        Statically enumerating the full QP endpoint matrix at this scale is
        not feasible.
        Second, topology: the QP connectivity graph is implicitly determined
        by the collective algorithm's communication pattern and rank mapping;
        it is not known a priori and cannot be expressed as a static peer list.
        Third, lifecycle: RC QP connections are established and torn down
        dynamically per test run. Device.Rocev2Peer models static, persistent
        QP configurations and has no lifecycle management for dynamic connections.

        Do not configure Device.Rocev2Peer on devices referenced by
        Ccl.Communicator.device_names; CCL manages QP lifecycle internally.
      type: object
      properties:
        encapsulation:
          description: >-
            IP encapsulation type for all auto-generated QP data packets.
            ipv4: standard RoCEv2 over IPv4 (most common deployment).
            ipv6: RoCEv2 over IPv6 with Global Routing Header (GRH);
            requires IPv6 addresses configured on the communicator devices.
            Applies to both reliable_connection and unreliable_datagram.
          type: string
          default: ipv4
          x-field-uid: 1
          x-enum:
            ipv4:
              x-field-uid: 1
            ipv6:
              x-field-uid: 2
        connection_type:
          description: >-
            QP connection type and associated parameters. Follows the same
            discriminated-union pattern as Device.Rocev2.ConnectionType.
          $ref: '#/components/schemas/Ccl.Rocev2Template.ConnectionType'
          x-field-uid: 2

    Ccl.Rocev2Template.ConnectionType:
      description: >-
        Discriminated union for QP connection type, following the same pattern
        as Device.Rocev2.ConnectionType.
        reliable_connection (RC): ACK-based in-order delivery; per-QP rate
        control via DCQCN; used for Ring AllReduce.
        unreliable_datagram (UD): connectionless; one QP addresses multiple
        peers without per-pair setup; O(N) QP count vs O(N^2) for RC;
        used for AllToAll at scale.
      type: object
      properties:
        choice:
          type: string
          default: reliable_connection
          x-field-uid: 1
          x-enum:
            reliable_connection:
              x-field-uid: 1
            unreliable_datagram:
              x-field-uid: 2
        reliable_connection:
          $ref: '#/components/schemas/Ccl.Rocev2Template.ReliableConnection'
          x-field-uid: 2
        unreliable_datagram:
          $ref: '#/components/schemas/Ccl.Rocev2Template.UnreliableDatagram'
          x-field-uid: 3

    Ccl.Rocev2Template.ReliableConnection:
      description: >-
        Parameters for Reliable Connection (RC) QPs auto-generated by the CCL
        engine. Applies as a shared template across all RC QPs in the
        communicator. Mirrors Device.Rocev2.QPParameters (dscp, ecn) but as a
        template rather than a per-QP static configuration.
        dscp and ecn are placed here (not at the top level of Rocev2Template)
        following the same convention as Device.Rocev2.QPParameters, which also
        sits under reliable_connection. Both fields primarily serve DCQCN
        congestion control, which requires RC per-QP connection state.
      type: object
      properties:
        dscp:
          x-status:
            status: under-review
            information: Not yet mapped to a backend parameter. Target field is Rocev2GenPortParams.DscpValue.
          description: >-
            IP DSCP value applied to all auto-generated RC QP data packets.
            All ranks in the communicator use the same DSCP value to ensure
            consistent mapping to the DUT lossless priority queue.
            Typical value: 24 (CS3) for RoCEv2 traffic.
            Corresponds to Device.Rocev2.QPParameters.dscp, which sets DSCP
            for one individually-configured QP; here it is a shared template.
          type: integer
          default: 24
          minimum: 0
          maximum: 63
          x-field-uid: 1
        ecn:
          x-status:
            status: under-review
            information: Not yet mapped to a backend parameter. Requires setting ECN bits in the stream IP header.
          description: >-
            ECN codepoint in the IP header for all auto-generated RC QP data
            packets. ect_1 (01) or ect_0 (10) marks packets as ECN-capable,
            enabling DCQCN congestion signals from the DUT when its buffers fill.
            DCQCN is an RC-specific mechanism: the receiver detects CE-marked
            packets and sends CNP back to the sender QP to trigger rate reduction.
            Corresponds to Device.Rocev2.QPParameters.ecn.
          type: string
          default: ect_1
          x-field-uid: 2
          x-enum:
            non_ect:
              x-field-uid: 1
            ect_1:
              x-field-uid: 2
            ect_0:
              x-field-uid: 3
            ce:
              x-field-uid: 4
        enable_ecn_cnp:
          description: >-
            Enable ECN/CNP (Congestion Notification Packet) processing.
            When true, the tester generates CNP frames in response to
            CE-marked packets received from the DUT, activating the DCQCN
            rate-reduction loop on the sender side. Set false to measure
            baseline throughput without congestion control.
            CNP generation requires per-QP connection state and is therefore
            an RC-specific mechanism; this field is not applicable to
            unreliable_datagram.
            Rocev2.PerPortSettings.dcqcn_settings exposes the full DCQCN
            algorithm parameters (alpha, rate timers, thresholds). This field
            is a simpler on/off covering the common need of toggling DCQCN
            without tuning algorithm internals.
          type: boolean
          default: true
          x-field-uid: 3

    Ccl.Rocev2Template.UnreliableDatagram:
      description: >-
        Parameters for Unreliable Datagram (UD) QPs auto-generated by the CCL
        engine. UD QPs are used for AllToAll at scale where RC per-pair
        connection overhead (O(N^2) QPs) is not feasible.
        No sub-fields are defined at this time. UD-specific parameters will be
        added as the AllToAll use case matures.
      type: object
