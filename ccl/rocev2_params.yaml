openapi: 3.0.3
info:
  title: CCL RoCEv2 parameters models
  version: ^0.0.0
components:
  schemas:
    Ccl.Rocev2Params:
      description: >-
        RoCEv2 transport parameters applied as a shared template to all QPs
        auto-generated by the CCL engine. Only applicable when
        Ccl.Config.transport = rocev2; ignored for transport = uet.

        Why not reuse Device.Rocev2Peer? Three reasons.
        First, scale: CCL generates O(N × qps_per_rank) QPs for Ring algorithms
        and O(N² × qps_per_rank) for AllToAll, where N is the rank count.
        Statically enumerating the full QP endpoint matrix at this scale is
        not feasible.
        Second, topology: the QP connectivity graph is implicitly determined
        by the collective algorithm's communication pattern and rank mapping —
        it is not known a priori and cannot be expressed as a static peer list.
        Third, lifecycle: RC QP connections are established and torn down
        dynamically per test run. Device.Rocev2Peer models static, persistent
        QP configurations and has no lifecycle management for dynamic connections.

        Do not configure Device.Rocev2Peer on devices referenced by
        Ccl.Communicator.device_names; CCL manages QP lifecycle internally.
      type: object
      properties:
        dscp:
          x-status:
            status: under-review
            information: Not yet mapped to a backend parameter.
          description: >-
            IP DSCP value applied to all auto-generated QP data packets.
            All ranks in the communicator use the same DSCP value to map
            traffic to the DUT lossless queue (typically 24 for RoCEv2).
            Corresponds to Device.Rocev2Peer.Rocev2.QPParameters.dscp, which
            sets DSCP for one individually-configured QP. Here it is a shared
            template applied to all CCL-generated QPs.
          type: integer
          default: 24
          minimum: 0
          maximum: 63
          x-field-uid: 1
        ecn:
          x-status:
            status: under-review
            information: Not yet mapped to a backend parameter.
          description: >-
            ECN codepoint in the IP header for all auto-generated QP data
            packets. ect_1 (01) marks packets as ECN-capable, enabling DCQCN
            congestion signals from the DUT when buffers fill.
            Corresponds to Device.Rocev2Peer.Rocev2.QPParameters.ecn, which
            sets ECN for one individually-configured QP. Here it is a shared
            template applied to all CCL-generated QPs.
          type: string
          x-field-uid: 2
          x-enum:
            non_ect:
              x-field-uid: 1
            ect_1:
              x-field-uid: 2
            ect_0:
              x-field-uid: 3
            ce:
              x-field-uid: 4
        pfc_priority:
          description: >-
            PFC priority class (0-7) used for all CCL-generated QP traffic.
            Must match the DSCP-to-priority mapping on the DUT lossless queue.
            Layer1.pfc_class_N configures pause quanta per class at link level;
            this field identifies which class number the CCL traffic belongs to,
            so the tester can respond correctly to incoming PFC pause frames.
          type: integer
          default: 3
          minimum: 0
          maximum: 7
          x-field-uid: 3
        transport_service_type:
          description: >-
            QP service type for all auto-generated QPs.
            ud (Unreliable Datagram): connectionless; one QP can address multiple
            peers without Connection Manager setup. Lower overhead; used for
            AllToAll without PXN.
            rc (Reliable Connection): ACK-based in-order delivery; requires
            Connection Manager handshake per QP pair. CCL implementations
            manage the QP lifecycle internally rather than through the standard
            CM flow. Used for Ring AllReduce and AllToAll with PXN.
            Corresponds to Device.Rocev2Peer.Rocev2.ConnectionType.choice (RC/UD)
            at the individual QP level. Here it is a global setting for all
            CCL-generated QPs in this communicator.
          type: string
          default: rc
          x-field-uid: 6
          x-enum:
            ud:
              x-field-uid: 1
            rc:
              x-field-uid: 2
        enable_ecn_cnp:
          description: >-
            Enable ECN/CNP (Congestion Notification Packet) processing.
            When true, the tester generates CNP frames in response to
            ECN-marked packets received from the DUT, activating the DCQCN
            rate-reduction loop on the sender side. Set false to measure
            baseline throughput without congestion control.
            Rocev2.PerPortSettings.dcqcn_settings exposes the full DCQCN
            algorithm (alpha, rate timers, increment thresholds). This field
            is a simpler on/off that covers the common test need of toggling
            DCQCN on or off without tuning the algorithm parameters.
          type: boolean
          default: true
          x-field-uid: 11
        enable_pfc:
          description: >-
            Enable PFC (Priority Flow Control) pause frame generation and
            processing on the pfc_priority queue.
            When true, the tester sends PFC PAUSE frames when its receive
            buffer fills and honors incoming PFC PAUSE from the DUT, achieving
            lossless Ethernet behavior for the CCL traffic class.
            Set false to test lossy behavior or measure the impact of disabling
            flow control.
            Layer1.pfc_class_N configures PFC pause quanta at link level and
            does not provide a per-traffic-class on/off switch. This field
            fills that gap for the CCL test scenario by explicitly enabling or
            disabling PFC for the class identified by pfc_priority.
          type: boolean
          default: true
          x-field-uid: 12
        encapsulation:
          description: >-
            IP encapsulation type for all auto-generated QP data packets.
            ipv4: standard RoCEv2 over IPv4 (most common deployment).
            ipv6: RoCEv2 over IPv6 with Global Routing Header (GRH);
            requires IPv6 addresses configured on the communicator devices.
          type: string
          default: ipv4
          x-field-uid: 13
          x-enum:
            ipv4:
              x-field-uid: 1
            ipv6:
              x-field-uid: 2
