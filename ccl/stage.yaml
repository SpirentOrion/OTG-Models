openapi: 3.0.3
info:
  title: CCL stage models
  version: ^0.0.0
components:
  schemas:
    Ccl.Stage:
      description: >-
        One stage in a CCL test. Each stage defines its own algorithm,
        communicators, and traffic parameters. Stages are executed in the order
        they appear in Ccl.Config.stages[].
      type: object
      required:
        - name
      properties:
        name:
          description: Unique name for this stage within the CCL configuration.
          type: string
          x-field-uid: 1
        algorithm:
          $ref: './algorithm.yaml#/components/schemas/Ccl.Algorithm'
          x-field-uid: 3
        communicators:
          description: >-
            List of communicators for this stage. Each communicator defines
            the set of ranks participating in the collective operation.
          type: array
          items:
            $ref: './communicator.yaml#/components/schemas/Ccl.Communicator'
          x-field-uid: 4
        traffic_params:
          $ref: './traffic_params.yaml#/components/schemas/Ccl.TrafficParams'
          x-field-uid: 5
        enable_bg_traffic:
          description: >-
            Enable background traffic streams (configured via Config.flows)
            during this stage. In single-stage mode users control bg traffic
            independently via SetControlState(flows). In multi-stage mode the
            Sequencer uses this flag to start/stop flows between stages.
          type: boolean
          default: false
          x-field-uid: 6
