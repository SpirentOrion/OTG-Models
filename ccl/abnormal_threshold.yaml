openapi: 3.0.3
info:
  title: CCL abnormal threshold models
  version: ^0.0.0
components:
  schemas:
    Ccl.AbnormalThreshold:
      description: >-
        Thresholds for flagging and recording abnormal iterations. When any
        threshold is exceeded in an iteration, that iteration is captured in
        CclAbnormalIterationMetric results. Set a threshold to 0 to disable it.
      type: object
      properties:
        jct_percent_threshold:
          description: >-
            Record if CalibratedJCT / IdealJCT * 100 exceeds this value.
            Example: 105.0 means record iterations that are more than 5%
            slower than ideal JCT.
          type: number
          format: float
          default: 105.0
          minimum: 0
          x-field-uid: 1
        packet_drop_percent_threshold:
          description: Record if the packet drop percentage exceeds this value.
          type: number
          format: float
          default: 5.0
          minimum: 0
          x-field-uid: 2
        packet_reorder_percent_threshold:
          description: Record if the packet reorder percentage exceeds this value.
          type: number
          format: float
          default: 5.0
          minimum: 0
          x-field-uid: 3
        max_record_count:
          description: Maximum number of abnormal iteration records to retain.
          type: integer
          default: 5000
          minimum: 1
          x-field-uid: 4
